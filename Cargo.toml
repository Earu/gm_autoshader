[package]
name = "gm_autoshader"
version = "1.0.0"
edition = "2021"
authors = ["Earu"]
description = "Garry's Mod module to compile hlsl files automatically"

[lib]
crate-type = ["cdylib"]

[dependencies]
gmod = { git = "https://github.com/WilliamVenner/gmod-rs", default-features = false, features = ["gmcl"] }
notify = { version = "6", default-features = false, features = ["macos_fsevent"] }
crossbeam = "0.8"
reqwest = { version = "0.13.5", features = ["blocking"] }
